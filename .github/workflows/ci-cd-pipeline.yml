name: NexusOps Enterprise CI/CD & Production Deployment Pipeline

on:
  push:
    branches: [ main, release/* ]
  pull_request:
    branches: [ main ]

env:
  AWS_REGION: ${{ secrets.AWS_REGION || 'us-east-1' }}
  EKS_CLUSTER_NAME: nexusops-cluster
  IMAGE_TAG: ${{ github.sha }}

jobs:
  build-and-test:
    name: 🧪 Build & Test Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend-web/package-lock.json

      - name: 📦 Restore & Test ASP.NET Core Services
        run: |
          dotnet restore backend-dotnet/src/NexusOps.Api/NexusOps.Api.csproj
          dotnet test backend-dotnet/tests/NexusOps.Api.Tests/NexusOps.Api.Tests.csproj --no-restore --verbosity normal

      - name: 🐍 Install & Test Python AI Engine
        run: |
          python -m pip install --upgrade pip
          if [ -f backend-ai-fastapi/requirements.txt ]; then pip install -r backend-ai-fastapi/requirements.txt; fi
          python backend-ai-fastapi/tests/test_standalone.py

      - name: 🌐 Install & Build Next.js Web Console
        run: |
          cd frontend-web
          npm ci
          npm run build

      - name: 📊 Run Production Readiness Audit
        run: |
          python devops/scripts/production_readiness_audit.py

  terraform-check:
    name: 🏗️ Terraform Infrastructure Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.7.0

      - name: Terraform Format & Validate
        run: |
          cd terraform
          terraform init -backend=false
          terraform fmt -check
          terraform validate

  deploy-production:
    name: 🚀 Production Cluster Continuous Deployment
    needs: [build-and-test, terraform-check]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        if: ${{ secrets.AWS_ACCESS_KEY_ID != '' }}
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup kubectl & Helm
        if: ${{ secrets.AWS_ACCESS_KEY_ID != '' }}
        uses: azure/setup-kubectl@v3
        with:
          version: 'v1.29.0'

      - name: Update Kubeconfig for EKS Cluster
        if: ${{ secrets.AWS_ACCESS_KEY_ID != '' }}
        run: |
          aws eks update-kubeconfig --region ${{ env.AWS_REGION }} --name ${{ env.EKS_CLUSTER_NAME }}

      - name: Deploy Kubernetes Manifests & Zero-Trust Mesh
        if: ${{ secrets.AWS_ACCESS_KEY_ID != '' }}
        run: |
          kubectl apply -f k8s/namespace.yaml
          kubectl apply -f k8s/configmap.yaml
          kubectl apply -f k8s/secrets.yaml
          kubectl apply -f k8s/pdb.yaml
          kubectl apply -f k8s/network-policy.yaml
          kubectl apply -f k8s/postgres-statefulset.yaml
          kubectl apply -f k8s/redis-deployment.yaml
          kubectl apply -f k8s/backend-dotnet-deployment.yaml
          kubectl apply -f k8s/backend-ai-fastapi-deployment.yaml
          kubectl apply -f k8s/frontend-web-deployment.yaml
          kubectl apply -f k8s/ingress.yaml
          kubectl apply -f k8s/service-mesh/

      - name: Execute Argo Canary Progressive Delivery Verifier
        if: ${{ secrets.AWS_ACCESS_KEY_ID != '' }}
        run: |
          bash devops/scripts/canary_deployment_verifier.sh

      - name: Deployment Summary Notification
        run: |
          echo "🎉 NexusOps Enterprise Continuous Deployment Pipeline Executed Successfully!"
