    apiVersion: apps/v1
    kind: Deployment
    name: {{ .Release.Name }}-backend-ai-fastapi
  minReplicas: {{ .Values.services.backendAiFastapi.autoscaling.minReplicas }}
  maxReplicas: {{ .Values.services.backendAiFastapi.autoscaling.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.services.backendAiFastapi.autoscaling.targetCPUUtilizationPercentage }}
{{- end }}
