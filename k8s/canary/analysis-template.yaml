# ==============================================================================
# NexusOps Enterprise - Argo Rollouts Prometheus Metric Analysis Template
# ==============================================================================

apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  name: nexusops-success-rate-analysis
  namespace: nexusops-enterprise
spec:
  args:
    - name: service-name
  metrics:
    # 1. Success Rate Metric (>99.5%)
    - name: success-rate
      interval: 30s
      successCondition: result[0] >= 0.995
      failureLimit: 3
      provider:
        prometheus:
          address: http://prometheus-k8s.monitoring.svc.cluster.local:9090
          query: |
            sum(rate(http_requests_total{service="{{args.service-name}}", status=~"2.*"}[2m]))
            /
            sum(rate(http_requests_total{service="{{args.service-name}}"}[2m]))

    # 2. P95 Latency Metric (<200ms)
    - name: p95-latency
      interval: 30s
      successCondition: result[0] <= 200
      failureLimit: 3
      provider:
        prometheus:
          address: http://prometheus-k8s.monitoring.svc.cluster.local:9090
          query: |
            histogram_quantile(0.95, sum(rate(http_request_duration_seconds_bucket{service="{{args.service-name}}"}[2m])) by (le)) * 1000
