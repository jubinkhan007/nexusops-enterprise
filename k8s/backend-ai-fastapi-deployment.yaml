apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-ai-fastapi
  namespace: nexusops
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend-ai-fastapi
  template:
    metadata:
      labels:
        app: backend-ai-fastapi
    spec:
      containers:
        - name: backend-ai-fastapi
          image: nexusops/backend-ai-fastapi:latest
          ports:
            - containerPort: 8000
              name: http
          envFrom:
            - configMapRef:
                name: nexusops-config
            - secretRef:
                name: nexusops-secrets
          readinessProbe:
            httpGet:
              path: /api/v1/health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: 8000
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1.5"
              memory: "2Gi"
---
apiVersion: v1
kind: Service
metadata:
  name: backend-ai-fastapi
  namespace: nexusops
spec:
  ports:
    - port: 8000
      targetPort: 8000
      name: http
  selector:
    app: backend-ai-fastapi
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: backend-ai-fastapi-hpa
  namespace: nexusops
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: backend-ai-fastapi
  minReplicas: 2
  maxReplicas: 8
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 80
