apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-dotnet
  namespace: nexusops
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend-dotnet
  template:
    metadata:
      labels:
        app: backend-dotnet
    spec:
      containers:
        - name: backend-dotnet
          image: nexusops/backend-dotnet:latest
          ports:
            - containerPort: 5000
              name: http
          envFrom:
            - configMapRef:
                name: nexusops-config
            - secretRef:
                name: nexusops-secrets
          readinessProbe:
            httpGet:
              path: /api/workflows/health
              port: 5000
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/workflows/health
              port: 5000
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "1"
              memory: "1Gi"
---
apiVersion: v1
kind: Service
metadata:
  name: backend-dotnet
  namespace: nexusops
spec:
  ports:
    - port: 5000
      targetPort: 5000
      name: http
  selector:
    app: backend-dotnet
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: backend-dotnet-hpa
  namespace: nexusops
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: backend-dotnet
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 75
